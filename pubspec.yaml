name: wallet_app
description: Experimental Flutter wallet (mock data only).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  mobile_scanner: ^5.2.3
  # الوصل PDF ومشاركته (واتساب وغيره)
  pdf: ^3.11.1
  path_provider: ^2.1.4
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/arrow.png
    - assets/images/logo.png

  # نعرّف فقط الأوزان المستخدمة فعلاً (400 / 500 / 600 / 700) — أي ملف خط ناقص
  # أو باسم مختلف (Linux حسّاس لحالة الأحرف) يُفشل البناء كله.
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
