name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # بدون تثبيت رقم إصدار: نستخدم آخر stable (قالب أندرويد حديث فيه Kotlin جديد)
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # المشروع ما فيه مجلد android، فنولّده هنا مع حماية ملفاتنا من الاستبدال
      - name: Generate android folder
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create --platforms=android --project-name wallet_app --org com.example .
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf test

      # حماية إضافية: لو القالب المولَّد فيه Kotlin أقدم من 1.9 نرفعه
      # (هذا سبب خطأ "incompatible version of Kotlin" مع shared_preferences)
      - name: Ensure modern Kotlin plugin
        run: |
          for f in android/settings.gradle android/settings.gradle.kts; do
            [ -f "$f" ] && sed -i -E 's/(org\.jetbrains\.kotlin\.android" version ")1\.[0-8]\.[0-9]+/\11.9.24/' "$f"
          done
          grep -rn "kotlin" android/settings.gradle* android/build.gradle* || true

      - name: Add camera permission
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "CAMERA" android/app/src/main/AndroidManifest.xml

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64

      # طريقة 1: Artifact (يتنزل كملف zip)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wallet-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # طريقة 2: Release (رابط مباشر للـ APK بدون zip)
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          prerelease: true
          files: build/app/outputs/flutter-apk/app-release.apk
